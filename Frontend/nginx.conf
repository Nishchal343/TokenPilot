map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/tokenpilot-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tokenpilot-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # These browser routes are under the same prefix as the dashboard API.
    # Match them before the generic proxy location so refreshes load React.
    location ~ ^/dashboard/(company/(teams|budget-approval|invitations|ai-workspace)|team-leader/(my-team|team-budget|ai-workspace)|member/(requests|ai-workspace))$ {
        try_files /index.html =404;
    }

    location ~ ^/(auth|api|dashboard|organization|token-budgets|notifications|invitations|profile|settings|security|support|workspace|uploads)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 180s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
